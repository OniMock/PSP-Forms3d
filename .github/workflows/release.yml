name: Release

on:
  push:
    tags:
      - 'v*'

jobs:
  build:
    runs-on: ubuntu-latest
    container: pspdev/pspdev:latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Fix git permissions
        run: git config --global --add safe.directory "$GITHUB_WORKSPACE"

      - name: Compile
        run: |
          make clean
          make

      - name: Upload Build Artifact
        uses: actions/upload-artifact@v4
        with:
          name: psp-binary
          path: |
            EBOOT.PBP
            assets/

  release:
    needs: build
    runs-on: ubuntu-latest
    steps:
      - name: Download Artifacts
        uses: actions/download-artifact@v4
        with:
          name: psp-binary
          path: Forms3D/

      - name: Package ZIP
        run: |
          TAG_NAME=${GITHUB_REF#refs/tags/}
          zip -r Forms3D-PSP-${TAG_NAME}.zip Forms3D/

      - name: Create Release
        uses: softprops/action-gh-release@v2
        with:
          files: Forms3D-PSP-*.zip
          body: |
            ## How to install on PSP:
            1. Download the `.zip` file below.
            2. Extract the `Forms3D` folder.
            3. Connect your PSP to your PC via USB.
            4. Copy the `Forms3D` folder to your Memory Stick at: `/PSP/GAME/`.
            5. On your PSP, go to **Game -> Memory Stick™** and launch **Forms 3D**.
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
