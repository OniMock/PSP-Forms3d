name: Release

on:
  push:
    tags:
      - 'v*'

jobs:
  build-and-release:
    runs-on: ubuntu-latest
    container: pspdev/pspdev:latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Fix git permissions
        run: git config --global --add safe.directory "$GITHUB_WORKSPACE"

      - name: Compile
        run: |
          make clean
          make

      - name: Package Release
        run: |
          # Install zip as it is not pre-installed in the pspdev container
          apt-get update && apt-get install -y zip
          # Get tag name
          TAG_NAME=${GITHUB_REF#refs/tags/}
          # Setup folder structure: Forms3D/ at the root
          mkdir -p release/Forms3D
          cp EBOOT.PBP release/Forms3D/
          cp -r assets release/Forms3D/
          # Create zip
          cd release
          zip -r ../Forms3D-PSP-${TAG_NAME}.zip .
          cd ..

      - name: Create Release
        uses: softprops/action-gh-release@v2
        with:
          files: Forms3D-PSP-*.zip
          body: |
            ## How to install on PSP:
            1. Download the `.zip` file below.
            2. Extract the `Forms3D` folder.
            3. Connect your PSP to your PC via USB.
            4. Copy the `Forms3D` folder to your Memory Stick at: `/PSP/GAME/`.
            5. On your PSP, go to **Game -> Memory Stick™** and launch **Forms 3D**.
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
